<main>

```
<section class="page-title">
    <h2>Make an Enquiry</h2>
    <p>Fill in the form below if you have an enquiry.</p>
</section>

<section class="form-box">

    <form>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="meal">Meal</label>
        <select id="meal" name="meal">
            <option value="">Select a meal</option>
            <option value="kota">Kota</option>
            <option value="gatsby">Gatsby</option>
            <option value="wings">Wings & Chips</option>
            <option value="russian">Russian & Chips</option>
            <option value="burger">Burger</option>
            <option value="chips">Chips</option>
        </select>

        <label for="message">Your Enquiry</label>
        <textarea id="message" name="message" rows="5"
            placeholder="Write your enquiry here"></textarea>

        <button type="submit">Submit</button>

    </form>

</section>

</main>

<footer>
    <p>2026 Lolwethu's Fast Food Kitchen</p>
</footer>

</body>
